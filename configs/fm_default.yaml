# Flow-matching model training config.
# Usage: python scripts/train.py configs/fm_default.yaml

run:
  train_model: fm            # fm | mult
  name: rp_fm_v3_ddtv_220726
  devices: [1, 2, 4, 6, 7]
  nodes: 1                   # number of nodes (SLURM --nodes / Trainer num_nodes); devices are per node
  precision: 32
  matmul_precision: medium
  dtype: float32
  epochs: 10
  dataset_size: 20_000_000     # only used to compute scheduler total_steps
  compile: model             # false | model
  gradient_clip_val: 1.0
  val_check_interval: 0.2
  limit_val_batches: 4
  strategy: ddp
  ckpt_dir: null             # base dir (null -> $LEGO_CKPT_DIR -> ./checkpoints/); flow|mult appended

logging:
  comet: true
  csv_dir: null              # when comet is false: directory for a lightning CSVLogger (metrics.csv); null = no logging
  project: lego_pdgid        # api key / workspace come from .env

config:
  dl_conf:
    lds_args:
      data: rp_010726   # prefixed with $LEGO_DATA_DIR at runtime
      frac: 1.0
      cutoff_mev: 10
      min_particles: 0
    bs: 4096
    num_workers: 16

  val_conf:
    val_frac: 0.01
    seed: 0

  base_conf:
    kappa: 8.0
    bs_frac: 0.0
    base_dist: poles
    scale_dist: sm_norm
    sm_scale: 0.5            # sm_norm tanh temperature (0.5 = old /2); raise to flatten the energy base
    tanh_theta: true

  model_conf:
    manifold:
      - { name: euclidean, dim: 1 }
      - { name: sphere, dim: 3 }
      - { name: sphere, dim: 3 }
    ot_coupling: true
    ot_e_only: false
    max_energy: 300.0
    t_dist: sd3
    t_dist_scale: 0.0
    t_dist_shift: 1.3       # density ~ k*t^(k-1): slight right shift toward t=1 (1.0 = off)
    loss_sc: 0.
    one_step_euler_fac: 0.
    curv_fac: 0.5            # d/dt v curvature penalty along the predicted velocity (0 = off)
    curv_every: 4            # apply every N-th optimizer step (loss rescaled by N)
    curv_eps: 0.05           # FD step; match the solver step scale (smaller probes sub-step roughness)
    curv_warmup: 500         # linear ramp-in over optimizer steps (0 = no ramp)
    reflow_kwargs: {method: midpoint, step_size: 0.5}
    reflow_start_epoch: 2
    reflow_every: 4
    t_zero_frac: 0.
    base_dist_loss: 1.
    base_pretrain_batches: 1000
    base_pretrain_bs: 16384
    mask_conf: { p_forward: 1. }
    cond_cube: false
    canon_sym: true
    model_args:
      h_dim: 256
      in_dim: 7
      nlayers: 6
      nhead: 8
      dropout: 0.
      ff_mult: 4
      nvtypes: 2
      use_adaptive_rmsnorm: true
      use_adaptive_layerscale: true
      ff_swish: true
      ff_glu: true
      ff_no_bias: false
      attn_flash: true
      attn_qk_norm: true
      attn_value_rmsnorm: true

  opt_conf:
    opt: muon
    lr: 1.0e-3
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 7.0e-3
    weight_decouple: true
    adamw_lr: 3.0e-3
    adamw_betas: [0.9, 0.999]
    adamw_wd: 1.0e-2
    adamw_eps: 1.0e-8
    scheduler:                # total_steps computed from run.* when absent
      cls: warmup_cosine
      warmup_frac: 0.1
      eta_min: 1.0e-6
      interval: step

  additional:
    notes: ""
