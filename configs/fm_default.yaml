# Training config of the flow.
# Usage: python scripts/train.py configs/fm_default.yaml

run:
  train_model: fm            # fm | mult
  name: rp_fm_v3_ddtv_220726
  devices: [1, 2, 4, 6, 7]
  nodes: 1                   # number of nodes (SLURM --nodes / Trainer num_nodes); devices are per node
  precision: bf16-mixed      # ~20% faster than 32 at equal metrics; a model with a large attn_qk_norm_scale (a
                             # checkpoint from x-transformers < 2.25.5: 1000) gets fp32 attention automatically
  matmul_precision: medium
  dtype: float32
  epochs: 10
  dataset_size: 20_000_000     # for the scheduler's step count at construction only; fit uses the exact count
  compile: model             # false | model
  gradient_clip_val: 1.0
  val_check_interval: 0.2
  limit_val_batches: 4
  strategy: ddp
  ckpt_dir: null             # used as is; null -> $LEGO_CKPT_DIR (else ./checkpoints/) + flow/ or mult/

logging:
  comet: true
  csv_dir: null              # with comet false: the directory of a Lightning CSVLogger (metrics.csv); null: no logging
  project: lego_pdgid        # the comet project; api key and workspace come from .env

config:
  dl_conf:
    lds_args:
      data: rp_010726   # the dataset directory, under $LEGO_DATA_DIR
      frac: 1.0
      cutoff_mev: 10
      min_particles: 0
    bs: 4096
    num_workers: 16

  val_conf:
    val_frac: 0.01
    seed: 0

  base_conf:
    kappa: 8.0
    bs_frac: 0.0
    base_dist: poles
    scale_dist: sm_norm
    sm_scale: 0.5            # s of the energy base u = 1 - tanh(s |z|^q); a fresh base head starts from it
    tanh_theta: true
    base_head_lik: true      # the base head, fitted by likelihood; needs tanh_theta and the four flags below
    base_head_nout: true
    ang_shape: true
    ang_nout: true
    ang_species: true

  model_conf:
    manifold:
      - { name: euclidean, dim: 1 }
      - { name: sphere, dim: 3 }
      - { name: sphere, dim: 3 }
    ot_coupling: true
    max_energy: 300.0
    t_dist: sd3
    t_dist_scale: 0.0
    t_dist_shift: 1.3       # k: t -> t^(1/k), density ~ k t^(k-1): k > 1 toward t = 1, k < 1 toward t = 0 (1.0: off)
    one_step_euler_fac: 0.
    reflow_kwargs: {method: midpoint, step_size: 0.5}
    reflow_start_epoch: 0    # legacy; > 0: self-reflow from that epoch on (a reflow_path teacher runs from step 0)
    reflow_every: 4
    base_pretrain_batches: 9000   # the base head's fit: this many batches of base_pretrain_bs events
    base_pretrain_bs: 16384
    edep_log_min: 1.0e-6     # the floor [MeV] of E_dep's log scale
    edep_margin: true        # the margin token: E_dep as the log-odds of the deposited fraction of E_in + margin,
                             # for every incoming species (edep_margin_species: only for these)
    out_margin: true         # the outgoing energy on the margin scale of E_in + margin(pid_in, pid_out); needs a
                             # dataset that stores the outgoing energy in MeV (scripts/gen_data.py)
    exclude_absorbed: true   # an event without an outgoing particle: not trained on, generated as E_dep = E_in;
                             # for a low cutoff only: what escapes below the cutoff is missing from E_dep
    energy_border: true      # an outgoing energy outside [0, 1] moves straight to the border
    edep_whiten: true        # the flow carries the E_dep token in units of the base head's per-event prior
    mask_conf: { p_forward: 1. }
    canon_sym: true
    model_args:
      h_dim: 256
      in_dim: 7
      nlayers: 6
      nhead: 8
      dropout: 0.
      ff_mult: 4
      nvtypes: 2
      use_adaptive_rmsnorm: true
      use_adaptive_layerscale: true
      ff_swish: true
      ff_glu: true
      ff_no_bias: false
      attn_flash: true
      attn_qk_norm: true
      attn_value_rmsnorm: true

  opt_conf:
    opt: muon
    lr: 1.0e-3
    momentum: 0.95
    nesterov: true
    ns_steps: 5
    weight_decay: 7.0e-3
    weight_decouple: true
    adamw_lr: 3.0e-3
    adamw_betas: [0.9, 0.999]
    adamw_wd: 1.0e-2
    adamw_eps: 1.0e-8
    scheduler:                # total_steps: set to the trainer's exact step count
      cls: warmup_cosine
      warmup_frac: 0.1
      eta_min: 1.0e-6
      interval: step

  additional:
    notes: ""
